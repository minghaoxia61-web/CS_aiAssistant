name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run scan:secrets
      - run: npm test
      - run: npm run benchmark:rag
      - run: npm run benchmark:agent
      - run: npm run benchmark:bkt
      - run: npm run benchmark:llm
      - run: npm run build:web
      - run: npm run check:bundle
      - run: npm run smoke:production
